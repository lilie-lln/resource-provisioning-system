server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router (v6) handles routing client-side, so unknown
    # paths must still return index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
